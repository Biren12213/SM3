name: Build BiReN Final Locked APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify source ZIP
        run: |
          test -f BiReN_New_Start_Premium_2026.zip
          unzip -t BiReN_New_Start_Premium_2026.zip

      - name: Extract project
        run: |
          rm -rf project
          mkdir project
          unzip -q BiReN_New_Start_Premium_2026.zip -d project
          test -f project/BiReN_Android_Final_Locked/settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build APK
        run: |
          gradle -p project/BiReN_Android_Final_Locked assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BiReN-Final-Locked-APK
          path: project/BiReN_Android_Final_Locked/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
